{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanitation Dashboard - EcoPulse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="p-4 bg-light">
  <div class="container">
    <h2>Sanitation Worker Portal</h2>
    <hr>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h5>Doorstep Scanner</h5>
          <p class="text-muted">Scan household QR tags to record pickup status.</p>
          <button class="btn btn-eco btn-sm">Start Scanning</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h5>Assigned Route</h5>
          <p class="text-muted">View today's collection wards and streets.</p>
          <button class="btn btn-eco btn-sm">View Map Route</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
