{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Dumping | Smart Waste</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            font-family: 'Poppins', sans-serif;
        }

        .container-box {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        h2 {
            color: #12372a;
            font-weight: 600;
        }

        .btn-success {
            background: #1f6f50;
            border: none;
        }

    </style>

</head>

<body>

<div class="container-box">

    <h2>

        <i class="bi bi-geo-alt"></i>

        Report Illegal Dumping

    </h2>

    <p class="text-muted">

        Report waste dumping at an inappropriate location.

    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="mb-3">

            <label class="form-label">
                Dumping Location
            </label>

            {{ form.location }}

        </div>


        <div class="mb-3">

            <label class="form-label">
                Waste Type
            </label>

            {{ form.dumping_type }}

        </div>


        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            {{ form.description }}

        </div>


        <div class="mb-4">

            <label class="form-label">
                Reported Date
            </label>

            {{ form.reported_date }}

        </div>


        <button type="submit"
                class="btn btn-success">

            <i class="bi bi-send"></i>

            Submit Report

        </button>


        <a href="{% url 'citizen_dashboard' %}"
           class="btn btn-outline-secondary">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
