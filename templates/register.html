{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoPulse - Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Messages Display Block -->
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-4" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}

        <div class="text-center mb-4">
          <a href="{% url 'home' %}" class="text-decoration-none">
            <h3 class="fw-bold text-eco-primary">Eco<span style="color: var(--eco-secondary);">Pulse</span></h3>
          </a>
          <p class="text-muted small">Join the Digital Sanitation & Food Redistribution Network</p>
        </div>

        <div class="card card-eco p-4 bg-white">
          <form action="{% url 'register' %}" method="POST">
            {% csrf_token %}
            
            <h5 class="fw-bold text-eco-primary mb-3"><i class="fa-solid fa-user-plus me-2"></i>Account Details</h5>
            
            <div class="row g-3 mb-3">
              <div class="col-md-12">
                <label class="form-label small fw-bold">Select Registration Category</label>
                <select class="form-select" id="accountCategory" name="account_category" onchange="toggleFormFields()" required>
                  <option value="citizen">Resident / House Owner / Apartment</option>
                  <option value="business">Hotel / Restaurant / Commercial Establishment (Food Donor)</option>
                  <option value="ngo">NGO / Orphanage / Community Kitchen (Food Receiver)</option>
                  <option value="worker">Sanitation Worker</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Full Name / Entity Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="e.g. John Doe" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="+91 98765 43210" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-eco w-100 py-2">Complete Registration</button>
          </form>

          <div class="text-center mt-3">
            <span class="small text-muted">Already registered? </span>
            <a href="{% url 'login' %}" class="small fw-bold text-eco-primary text-decoration-none">Sign In</a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
