{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPulse - Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">

            <!-- MESSAGES -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <div class="text-center mb-4">
                <a href="{% url 'home' %}" class="text-decoration-none">
                    <h3 class="fw-bold text-success">EcoPulse</h3>
                </a>
                <p class="text-muted small">Select your role to access your dashboard</p>
            </div>

            <div class="card p-4 bg-white shadow-sm">
                <!-- ROLE TABS -->
                <ul class="nav nav-pills nav-justified mb-4" id="roleTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link small active" id="tab-citizen" type="button" onclick="switchRole('citizen')">
                            Citizen / NGO
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link small" id="tab-worker" type="button" onclick="switchRole('worker')">
                            Sanitation
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link small" id="tab-admin" type="button" onclick="switchRole('admin')">
                            Admin
                        </button>
                    </li>
                </ul>

                <!-- SINGLE FORM FOR ALL ROLES -->
                <form action="{% url 'login' %}" method="POST" id="loginForm">
                    {% csrf_token %}
                    
                    <!-- HIDDEN ROLE FIELD -->
                    <input type="hidden" name="user_type" id="user_type" value="citizen">

                    <!-- DYNAMIC USERNAME / WORKER ID FIELD -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold" id="identifierLabel">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted" id="identifierIcon"></i></span>
                            <input type="text" name="username" id="identifierInput" class="form-control" placeholder="Username or email" required>
                        </div>
                    </div>

                    <!-- PASSWORD FIELD -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 mt-2" id="submitBtn">
                        Login as Citizen / NGO
                    </button>
                </form>

                <div class="text-center mt-4">
                    <span class="small text-muted">New property owner or NGO?</span>
                    <a href="{% url 'register' %}" class="small fw-bold text-success text-decoration-none">Register Here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function switchRole(role) {
    const userTypeInput = document.getElementById('user_type');
    const identifierLabel = document.getElementById('identifierLabel');
    const identifierInput = document.getElementById('identifierInput');
    const identifierIcon = document.getElementById('identifierIcon');
    const submitBtn = document.getElementById('submitBtn');

    // Remove active class from all tabs
    document.querySelectorAll('#roleTabs .nav-link').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + role).classList.add('active');

    userTypeInput.value = role;

    if (role === 'citizen') {
        identifierLabel.textContent = 'Username or Email';
        identifierInput.name = 'username';
        identifierInput.placeholder = 'Username or email';
        identifierIcon.className = 'fa-solid fa-user text-muted';
        submitBtn.textContent = 'Login as Citizen / NGO';
    } else if (role === 'worker') {
        identifierLabel.textContent = 'Worker ID';
        identifierInput.name = 'worker_id';
        identifierInput.placeholder = 'Example: WORKER001';
        identifierIcon.className = 'fa-solid fa-id-badge text-muted';
        submitBtn.textContent = 'Login as Sanitation Worker';
    } else if (role === 'admin') {
        identifierLabel.textContent = 'Admin Username';
        identifierInput.name = 'username';
        identifierInput.placeholder = 'Admin username';
        identifierIcon.className = 'fa-solid fa-user-shield text-muted';
        submitBtn.textContent = 'System Admin Access';
    }
}
</script>
</body>
</html>
