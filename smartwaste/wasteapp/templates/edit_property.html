<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Property | Smart Waste</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        body {
            margin: 0;
            background: #f4f7f5;
            color: #263238;
        }


        /* ================= TOPBAR ================= */

        .topbar {

            background: #12372a;

            color: white;

            padding: 18px 35px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand-icon {

            width: 42px;

            height: 42px;

            background: #2e7d32;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

        }


        .brand h5 {

            margin: 0;

            font-size: 17px;

            font-weight: 600;

        }


        .brand small {

            color: #b9d8c5;

            font-size: 10px;

        }


        /* ================= PAGE ================= */

        .page-container {

            padding: 35px;

        }


        .edit-card {

            max-width: 850px;

            margin: 0 auto;

            background: white;

            border-radius: 15px;

            border: 1px solid #e4ebe6;

            overflow: hidden;

        }


        .edit-header {

            background: #edf7ef;

            padding: 22px 25px;

            border-bottom: 1px solid #dfe9e2;

        }


        .edit-header h4 {

            margin: 0;

            color: #183c2d;

            font-weight: 600;

            font-size: 20px;

        }


        .edit-header p {

            margin: 5px 0 0;

            color: #718078;

            font-size: 12px;

        }


        .edit-body {

            padding: 30px;

        }


        /* ================= PROPERTY ID ================= */

        .property-id-box {

            background: #f3f8f4;

            border: 1px solid #dce9df;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 25px;

        }


        .property-id-label {

            font-size: 10px;

            color: #7c8983;

            margin-bottom: 4px;

        }


        .property-id {

            color: #1b5e20;

            font-size: 15px;

            font-weight: 600;

        }


        /* ================= FORM ================= */

        .form-label {

            font-size: 12px;

            font-weight: 500;

            color: #34443b;

        }


        .form-control,

        .form-select {

            font-size: 12px;

            border: 1px solid #dce4df;

            border-radius: 8px;

            padding: 10px 12px;

        }


        .form-control:focus,

        .form-select:focus {

            border-color: #2e7d32;

            box-shadow: 0 0 0 0.15rem rgba(46,125,50,0.12);

        }


        textarea.form-control {

            min-height: 110px;

            resize: vertical;

        }


        /* ================= BUTTONS ================= */

        .btn-save {

            background: #2e7d32;

            border: none;

            color: white;

            padding: 10px 20px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 500;

        }


        .btn-save:hover {

            background: #1b5e20;

            color: white;

        }


        .btn-cancel {

            background: #f1f3f2;

            color: #526159;

            padding: 10px 20px;

            border-radius: 8px;

            font-size: 12px;

            text-decoration: none;

        }


        .btn-cancel:hover {

            background: #e4e8e5;

            color: #263238;

        }


        /* ================= ALERT ================= */

        .alert {

            font-size: 12px;

            border-radius: 8px;

        }


        /* ================= RESPONSIVE ================= */

        @media(max-width: 768px) {

            .topbar {

                padding: 15px 18px;

            }


            .page-container {

                padding: 20px 15px;

            }


            .edit-body {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">


    <div class="brand">


        <div class="brand-icon">

            <i class="fa-solid fa-recycle"></i>

        </div>


        <div>

            <h5>
                Smart Waste
            </h5>

            <small>
                Resource Management System
            </small>

        </div>


    </div>


    <a
        href="{% url 'admin_dashboard' %}"
        class="btn btn-sm btn-outline-light">

        <i class="fa-solid fa-chart-pie me-1"></i>

        Dashboard

    </a>


</div>



<!-- =====================================================
     PAGE
===================================================== -->

<div class="page-container">


    <div class="edit-card">


        <!-- HEADER -->

        <div class="edit-header">

            <h4>

                <i class="fa-solid fa-pen-to-square text-success me-2"></i>

                Edit Property

            </h4>


            <p>

                Update the registered property information.

            </p>

        </div>



        <!-- BODY -->

        <div class="edit-body">


            <!-- MESSAGES -->

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-{{ message.tags }}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}



            <!-- PROPERTY ID -->

            <div class="property-id-box">


                <div class="property-id-label">

                    Property ID

                </div>


                <div class="property-id">

                    <i class="fa-solid fa-qrcode me-1"></i>

                    {{ property.property_id }}

                </div>


            </div>



            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}


                <div class="row g-4">


                    <!-- OWNER NAME -->

                    <div class="col-md-6">

                        <label
                            for="owner_name"
                            class="form-label">

                            Owner Name

                        </label>


                        <input
                            type="text"
                            id="owner_name"
                            name="owner_name"
                            class="form-control"
                            value="{{ property.owner_name }}"
                            required>

                    </div>



                    <!-- PROPERTY TYPE -->

                    <div class="col-md-6">

                        <label
                            for="property_type"
                            class="form-label">

                            Property Type

                        </label>


                        <select
                            id="property_type"
                            name="property_type"
                            class="form-select"
                            required>


                            <option
                                value="HOUSE"
                                {% if property.property_type == "HOUSE" %}selected{% endif %}>

                                House

                            </option>


                            <option
                                value="APARTMENT"
                                {% if property.property_type == "APARTMENT" %}selected{% endif %}>

                                Apartment

                            </option>


                            <option
                                value="HOTEL"
                                {% if property.property_type == "HOTEL" %}selected{% endif %}>

                                Hotel

                            </option>


                            <option
                                value="RESTAURANT"
                                {% if property.property_type == "RESTAURANT" %}selected{% endif %}>

                                Restaurant

                            </option>


                            <option
                                value="SCHOOL"
                                {% if property.property_type == "SCHOOL" %}selected{% endif %}>

                                School

                            </option>


                            <option
                                value="HOSPITAL"
                                {% if property.property_type == "HOSPITAL" %}selected{% endif %}>

                                Hospital

                            </option>


                            <option
                                value="COMMERCIAL"
                                {% if property.property_type == "COMMERCIAL" %}selected{% endif %}>

                                Commercial Establishment

                            </option>


                        </select>

                    </div>



                    <!-- PHONE -->

                    <div class="col-md-6">

                        <label
                            for="phone"
                            class="form-label">

                            Phone

                        </label>


                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            class="form-control"
                            value="{{ property.phone }}"
                            maxlength="15">

                    </div>



                    <!-- REGISTERED DATE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Registered Date

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            value="{{ property.created_at|date:'d M Y, h:i A' }}"
                            readonly>

                    </div>



                    <!-- ADDRESS -->

                    <div class="col-12">

                        <label
                            for="address"
                            class="form-label">

                            Address

                        </label>


                        <textarea
                            id="address"
                            name="address"
                            class="form-control"
                            required>{{ property.address }}</textarea>

                    </div>


                </div>



                <!-- BUTTONS -->

                <div class="d-flex gap-2 mt-4">


                    <button
                        type="submit"
                        class="btn-save">

                        <i class="fa-solid fa-check me-1"></i>

                        Save Changes

                    </button>


                    <a
                        href="{% url 'property_detail' property.id %}"
                        class="btn-cancel">

                        Cancel

                    </a>


                </div>


            </form>


        </div>


    </div>


</div>


</body>

</html>
